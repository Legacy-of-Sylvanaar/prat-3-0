name: Module tests
on:
  pull_request:
  push:
    branches: [master]
jobs:
  secondary-chat-group:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
